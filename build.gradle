plugins {
    id 'base'
    id 'dev.architectury.loom' version '1.13.469' apply false
    id 'architectury-plugin' version '3.4.164'
    id 'com.gradleup.shadow' version '8.3.11' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = "${rootProject.mod_version}+mc${rootProject.minecraft_version}"
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'

    base {
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
        options.encoding = 'UTF-8'
    }

    tasks.withType(ProcessResources).configureEach {
        filteringCharset = 'UTF-8'
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.named('build') {
    dependsOn ':fabric:build', ':neoforge:build'
}

tasks.named('clean') {
    dependsOn ':common:clean', ':fabric:clean', ':neoforge:clean'
}
