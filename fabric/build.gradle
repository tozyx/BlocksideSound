plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

apply from: rootProject.file('gradle/scripts/platform.gradle')

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    // Optional settings entrypoint API only; never bundled or required at runtime.
    modCompileOnly('com.terraformersmc:modmenu:11.0.3') { transitive = false }

    // Local development runtime only: no publication or jar inclusion.
    if (rootProject.enable_dev_mods.toBoolean()) {
        modLocalRuntime 'com.terraformersmc:modmenu:11.0.3'
        modLocalRuntime 'net.fabricmc.fabric-api:fabric-api:0.116.6+1.21.1'
    }
}
