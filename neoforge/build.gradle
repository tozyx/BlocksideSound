plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

apply from: rootProject.file('gradle/scripts/platform.gradle')

repositories {
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }

    // Local development runtime only: https://modrinth.com/mod/better-modlist
    if (rootProject.enable_dev_mods.toBoolean()) {
        // Already uses Mojang names. Keep the original jar so its Jar-in-Jar
        // metadata survives; Loom's mod remapping strips that metadata.
        localRuntime('maven.modrinth:better-modlist:21.1.4') {
            transitive = false
        }
    }
}
